<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 5122.11" aria-label="500l/s"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/500ls.svg" x="28.45" y="140.76" width="184.29" height="73.77" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">stuttgart sits on europe's second-largest mineral</tspan><tspan x="28.45" y="325.40000000000003">water deposit – yet 75% of young residents don't</tspan><tspan x="28.45" y="349.40000000000003">know it exists. the springs hide in backyards, the</tspan><tspan x="28.45" y="373.40000000000003">baths look like ordinary public pools, and no visual</tspan><tspan x="28.45" y="397.40000000000003">language communicates the richness beneath the</tspan><tspan x="28.45" y="421.40000000000003">city.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="481.4">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="503.0">bring the mineral water to where the target group</tspan><tspan x="28.45" y="527.0">already is: bars and cafés. through "spring</tspan><tspan x="28.45" y="551.0">patronages," each venue adopts one of 13 springs</tspan><tspan x="28.45" y="575.0">and serves drinks made with its water. from cold</tspan><tspan x="28.45" y="599.0">drink to cold plunge.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="659.0">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="680.6">a generative design system translates the chemical</tspan><tspan x="28.45" y="704.6">data of each spring into individual waveforms,</tspan><tspan x="28.45" y="728.6">colors, and a parametric display typeface with 13</tspan><tspan x="28.45" y="752.6">cuts and 1,300 glyphs. it runs across all</tspan><tspan x="28.45" y="776.6">touchpoints – from out-of-home to drink menus to</tspan><tspan x="28.45" y="800.6">a stamp card that rewards a free bath entry once</tspan><tspan x="28.45" y="824.6">you've tasted all 13 springs.</tspan></text></g><g id="Awards"><g id="Award-tdc"><image href="assets/awards/tdc.png" x="28.45" y="884.6" width="44.14691151919866" height="44.0" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="90.5" y="899.6">selected for the tdc annual 2026</tspan><tspan x="90.5" y="923.6">the world's best typography</tspan></text></g><g id="Award-adc-ny"><image href="assets/awards/adc-ny.png" x="28.45" y="949.6" width="43.83396226415094" height="44.0" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="90.5" y="964.6">adc young ones 2026</tspan><tspan x="90.5" y="988.6">1× merit</tspan></text></g><g id="Award-adc-germany"><image href="assets/awards/adc-germany.svg" x="26.63989238523362" y="1011.7949325704946" width="50.970712436997694" height="50.970712436997694" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="90.5" y="1029.6">adc talent award 2026</tspan><tspan x="90.5" y="1053.6">1× bronze</tspan></text></g></g><g id="Bild-1" data-project-image="" data-clip="assets/projects/500ls/00_showreel.mp4" data-x="639.6" data-y="89.48" data-width="618.83" data-height="348.09"><image href="assets/projects/500ls/00_showreel.webp" x="639.6" y="89.48" width="618.83" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Film-1" data-video="JCJF8uDo0tQ" data-x="855.77" data-y="465.81" data-width="1037.85" data-height="583.79" data-poster="assets/projects/500ls/05_6953b6c6.webp" /><g id="Bild-2" data-project-image=""><image href="assets/projects/500ls/02_223d3fef.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Wavelab" data-project-image="" data-x="202.85" data-y="1292.69" data-width="831.2" data-height="467.55" data-wavelab=""><rect x="202.85" y="1292.69" width="831.2" height="467.55" fill="#F0EEE9" /></g><g id="Bild-4" data-project-image=""><image href="assets/projects/500ls/06_9495e648.webp" x="1214.38" y="1204.2" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-5" data-project-image=""><image href="assets/projects/500ls/05_6953b6c6.webp" x="720.56" y="1792.95" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6" data-project-image=""><image href="assets/projects/500ls/07_95625748.webp" x="1312.69" y="1748.24" width="580.93" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Tester" data-project-image="" data-x="26.38" data-y="2135.96" data-width="1037.85" data-height="583.79" data-tester=""><rect x="26.38" y="2135.96" width="1037.85" height="583.79" fill="#F0EEE9" /></g><g id="Bild-8" data-project-image=""><image href="assets/projects/500ls/09_a4214e3f.webp" x="559.65" y="2835.82" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-9" data-project-image=""><image href="assets/projects/500ls/08_9dde72a4.webp" x="855.77" y="3212.15" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Specimen" data-project-image="" data-x="494.12" data-y="3518.08" data-width="331.8" data-height="488.24" data-scrub="assets/projects/500ls/specimen.mp4"><image href="assets/projects/500ls/specimen.webp" x="494.12" y="3518.08" width="331.8" height="488.24" preserveAspectRatio="xMidYMid slice" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="660.02" y="4036.32">the full 500l/s character set, glyph by glyph</tspan></text><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400" text-anchor="middle" class="scrub-hint"><tspan x="660.02" y="4058.32">move up / down to scrub</tspan></text></g><g id="Bild-11" data-project-image=""><image href="assets/projects/500ls/10_a8472395.webp" x="1214.38" y="3950.54" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-12" data-project-image=""><image href="assets/projects/500ls/01_03c19a53.webp" x="720.56" y="4539.29" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Credits"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="role" data-body="art direction"><tspan x="28.45" y="4909.59">role</tspan><tspan x="28.45" y="4933.59">art direction</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="supervision" data-body="prof. ursula drees, lucie ilg"><tspan x="28.45" y="4993.59">supervision</tspan><tspan x="28.45" y="5017.59">prof. ursula drees, lucie ilg</tspan></text></g></svg>