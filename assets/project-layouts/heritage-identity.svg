<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 5409.37" aria-label="heritage identity"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/heritage-identity.svg" x="28.45" y="140.76" width="184.29" height="35.27" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">duravit has been making bathrooms in the black</tspan><tspan x="28.45" y="325.40000000000003">forest since 1817, and wanted that history to carry</tspan><tspan x="28.45" y="349.40000000000003">more of its communication. the groundwork</tspan><tspan x="28.45" y="373.40000000000003">existed: three heritage pillars, a colour for each, a</tspan><tspan x="28.45" y="397.40000000000003">first mood. but three colour worlds pull in three</tspan><tspan x="28.45" y="421.40000000000003">directions – and a heritage look of its own reads as</tspan><tspan x="28.45" y="445.40000000000003">a sub-brand, not the brand. the historic version of</tspan><tspan x="28.45" y="469.40000000000003">duravit's logo, the auerhahn, was proposed as</tspan><tspan x="28.45" y="493.40000000000003">heritage mark, but it was only available in the form</tspan><tspan x="28.45" y="517.4000000000001">of a physical woodcut.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="577.4000000000001">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="599.0000000000001">instead of a fourth look on top of three colour</tspan><tspan x="28.45" y="623.0000000000001">worlds, one production constraint underneath all of</tspan><tspan x="28.45" y="647.0000000000001">them: risography. one ink, one stock, three pillars,</tspan><tspan x="28.45" y="671.0000000000001">held together by how it's made.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="731.0000000000001">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="752.6000000000001">the historic woodcut is redrawn and set into a seal.</tspan><tspan x="28.45" y="776.6000000000001">the pillar colours stay, but are lightened into</tspan><tspan x="28.45" y="800.6000000000001">ink-and-ground pairs, so every combination clears</tspan><tspan x="28.45" y="824.6000000000001">contrast on light stock with one transparent ink.</tspan><tspan x="28.45" y="848.6000000000001">archive and current photography share one</tspan><tspan x="28.45" y="872.6000000000001">duotone, which levels the two – no then-and-now</tspan><tspan x="28.45" y="896.6000000000001">split. and the grain the mood called for stops being</tspan><tspan x="28.45" y="920.6000000000001">a filter: it becomes the physical raster.</tspan></text></g><g id="Awards" /><g id="Bild-1" data-project-image=""><image href="assets/projects/heritage-identity/01_siegel-knapp.webp" x="559.65" y="129.48000000000002" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="559.65" y="141.31">heritage logo with brandmark</tspan></text></g><g id="Bild-2" data-project-image="" data-clip="assets/projects/heritage-identity/02_showreel.mp4" data-x="855.77" data-y="545.81" data-width="1037.85" data-height="583.79"><image href="assets/projects/heritage-identity/02_showreel.webp" x="855.77" y="545.81" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-3" data-project-image=""><image href="assets/projects/heritage-identity/03_holzschnitt.webp" x="494.12" y="1027.21" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="494.12" y="1077.45">original wood cut</tspan></text></g><g id="Bild-4-1" data-project-image="" data-reveal-start="1569.64" data-reveal-distance="153.65"><image href="assets/projects/heritage-identity/04_evolution-1.webp" x="202.85" y="1569.64" width="159.61" height="153.65" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="202.85" y="1519.64">historic development of the image brand</tspan></text></g><g id="Bild-4-2" data-project-image="" data-reveal-start="1677.86" data-reveal-distance="228.42" data-reveal-speed="3"><image href="assets/projects/heritage-identity/04_evolution-2.webp" x="354.8" y="1577.86" width="145.72" height="128.42" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4-3" data-project-image="" data-reveal-start="1777.86" data-reveal-distance="328.42" data-reveal-speed="3"><image href="assets/projects/heritage-identity/04_evolution-3.webp" x="500.23" y="1577.86" width="134.66" height="128.42" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4-4" data-project-image="" data-reveal-start="1877.86" data-reveal-distance="428.42" data-reveal-speed="3"><image href="assets/projects/heritage-identity/04_evolution-4.webp" x="645.38" y="1577.86" width="117.08" height="128.42" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4-5" data-project-image="" data-reveal-start="1977.86" data-reveal-distance="528.42" data-reveal-speed="3"><image href="assets/projects/heritage-identity/04_evolution-5.webp" x="772.67" y="1577.86" width="134.94" height="128.42" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4-6" data-project-image="" data-reveal-start="2077.86" data-reveal-distance="628.42" data-reveal-speed="3"><image href="assets/projects/heritage-identity/04_evolution-6.webp" x="907.33" y="1577.86" width="126.72" height="128.42" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-5" data-project-image=""><image href="assets/projects/heritage-identity/16_messe-saeulen.webp" x="1214.38" y="1324.2" width="679.24" height="382.02" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6" data-project-image="" data-reveal-delay="150"><image href="assets/projects/heritage-identity/07_auerhahn-orange.webp" x="620.56" y="1912.95" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="724.19" y="1862.95">stylized brandmark</tspan></text></g><g id="Bild-7" data-project-image=""><image href="assets/projects/heritage-identity/05_editorial.webp" x="1114.38" y="2119.82" width="679.24" height="452.83" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1114.53" y="2069.82">print ad / editorial</tspan></text></g><g id="Bild-8" data-project-image="" data-clip="assets/projects/heritage-identity/08_social.mp4" data-x="26.38" data-y="2255.96" data-width="1037.85" data-height="583.79"><image href="assets/projects/heritage-identity/08_social.webp" x="26.38" y="2255.96" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="26.49" y="2205.96">social</tspan></text></g><g id="Bild-9" data-project-image=""><image href="assets/projects/heritage-identity/09_ansaetze-braun.webp" x="202.85" y="2955.82" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="202.85" y="2905.82">three approaches</tspan></text><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#8C6E5E"><tspan x="318.7" y="3290.45">low detail</tspan></text><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#8C6E5E"><tspan x="512.47" y="3287.13">medium detail</tspan></text><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#8C6E5E"><tspan x="711.86" y="3288.38">high detail</tspan></text><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#8C6E5E"><tspan x="898.56" y="3329.52">old</tspan></text></g><g id="Bild-10-1" data-project-image="" data-reveal-start="2829.63" data-reveal-distance="159.96"><image href="assets/projects/heritage-identity/10_farbe-1.webp" x="1214.38" y="2829.63" width="189.05" height="159.96" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1214.38" y="2779.63">proposed color scheme</tspan></text></g><g id="Bild-10-2" data-project-image="" data-reveal-start="2929.63" data-reveal-distance="259.96" data-reveal-speed="3"><image href="assets/projects/heritage-identity/10_farbe-2.webp" x="1403.43" y="2829.63" width="190.53" height="159.96" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-10-3" data-project-image="" data-reveal-start="3029.63" data-reveal-distance="359.96" data-reveal-speed="3"><image href="assets/projects/heritage-identity/10_farbe-3.webp" x="1593.97" y="2829.63" width="189.17" height="159.96" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-10-4" data-project-image="" data-reveal-start="3289.6" data-reveal-distance="459.96" data-reveal-speed="3"><image href="assets/projects/heritage-identity/10_farbe-4.webp" x="1214.38" y="2989.6" width="189.05" height="159.96" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-10-5" data-project-image="" data-reveal-start="3389.6" data-reveal-distance="559.96" data-reveal-speed="3"><image href="assets/projects/heritage-identity/10_farbe-5.webp" x="1403.43" y="2989.6" width="190.53" height="159.96" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-10-6" data-project-image="" data-reveal-start="3489.6" data-reveal-distance="659.96" data-reveal-speed="3"><image href="assets/projects/heritage-identity/10_farbe-6.webp" x="1593.97" y="2989.6" width="189.17" height="159.96" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-11" data-project-image=""><image href="assets/projects/heritage-identity/11_riso-ebenen.webp" x="202.85" y="3605.82" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="265.24" y="3555.82">process breakdown risography</tspan></text></g><g id="Bild-12" data-project-image=""><image href="assets/projects/heritage-identity/12_broschuere.webp" x="1214.38" y="3405.82" width="568.76" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1214.38" y="3376.19">brochure</tspan></text></g><g id="Bild-13" data-project-image=""><image href="assets/projects/heritage-identity/06_ooh.webp" x="202.85" y="4255.82" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="202.85" y="4205.82">ooh</tspan></text></g><g id="Bild-14" data-project-image=""><image href="assets/projects/heritage-identity/14_giveaway.webp" x="1214.38" y="4055.8199999999997" width="568.76" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1214.38" y="4057.92">giveaway</tspan></text></g><g id="Bild-15" data-project-image=""><image href="assets/projects/heritage-identity/15_social-flach.webp" x="1114.38" y="4631.27" width="664.96" height="208.05" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-16" data-project-image=""><image href="assets/projects/heritage-identity/13_messe-halle.webp" x="202.85" y="4905.82" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="202.85" y="4857.54">trade fair</tspan></text></g></svg>