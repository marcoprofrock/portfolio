<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2992.27" aria-label="azulejo six"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/azulejo-six.svg" x="28.45" y="140.76" width="104.57" height="139.53" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="340.155241747744">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="361.75524174774404">every number of the young ones countdown to the</tspan><tspan x="28.45" y="385.75524174774404">2027 awards goes to a different hand. one asset,</tspan><tspan x="28.45" y="409.75524174774404">1080 × 1350, and a digit that has to stay readable</tspan><tspan x="28.45" y="433.75524174774404">as a digit next to all the others in the feed. the</tspan><tspan x="28.45" y="457.75524174774404">usual answer is a number that morphs —</tspan><tspan x="28.45" y="481.75524174774404">interchangeable, and from nowhere in particular.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="541.755241747744">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="563.355241747744">on a road trip across the iberian peninsula i filled</tspan><tspan x="28.45" y="587.355241747744">almost 150 pages of a hand-bound grid sketchbook</tspan><tspan x="28.45" y="611.355241747744">with sixes, drawn after azulejo tilework. so the</tspan><tspan x="28.45" y="635.355241747744">animation does not show the number, it shows</tspan><tspan x="28.45" y="659.355241747744">where it comes from: first the surface, then the</tspan><tspan x="28.45" y="683.355241747744">joint grid, then the ornament lattice, then the sign</tspan><tspan x="28.45" y="707.355241747744">— the order in which an azulejo panel is actually</tspan><tspan x="28.45" y="731.355241747744">read.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="791.355241747744">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="812.955241747744">a field of 28 × 34 tiles in blue 80 and white, with</tspan><tspan x="28.45" y="836.955241747744">no soft transition anywhere: a tile is blue or white,</tspan><tspan x="28.45" y="860.955241747744">there is no 40 % blue. the lines are laid tile by tile,</tspan><tspan x="28.45" y="884.955241747744">the 6 peels out of the lattice counter-clockwise,</tspan><tspan x="28.45" y="908.955241747744">and a surf runs left to right through its belly. the</tspan><tspan x="28.45" y="932.955241747744">ornament frame is hand-drawn — one quarter of it,</tspan><tspan x="28.45" y="956.955241747744">mirrored on both centre axes — and changes in</tspan><tspan x="28.45" y="980.955241747744">time with the wave. four seconds, seamless loop,</tspan><tspan x="28.45" y="1004.955241747744">1080 × 1350.</tspan></text></g><g id="Awards" /><g id="Bild-1" data-project-image=""><image href="assets/projects/azulejo-six/01_sechs.webp" x="559.65" y="89.48" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2" data-project-image="" data-gif="assets/projects/azulejo-six/02_mosaik.gif" data-x="855.77" data-y="465.81" data-width="1037.85" data-height="583.79" /><g id="Bild-3" data-project-image=""><image href="assets/projects/azulejo-six/03_skizzenbuch.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4" data-project-image=""><image href="assets/projects/azulejo-six/04_barcelona.webp" x="202.85" y="1292.69" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-5" data-project-image=""><image href="assets/projects/azulejo-six/05_makro.webp" x="1214.38" y="1204.2" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6" data-project-image=""><image href="assets/projects/azulejo-six/06_welle.webp" x="720.56" y="1792.95" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-7" data-project-image="" data-gif="assets/projects/azulejo-six/07_stretch.gif" data-x="1312.69" data-y="1748.24" data-width="580.93" data-height="871.97" /><g id="Bild-8" data-project-image="" data-gif="assets/projects/azulejo-six/08_kachel.gif" data-x="26.38" data-y="2135.96" data-width="1037.85" data-height="583.79" /><g id="Credits"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="assignment" data-body="number 6 · young ones countdown to yo 2027"><tspan x="28.45" y="2779.75">assignment</tspan><tspan x="28.45" y="2803.75">number 6 · young ones countdown to yo 2027</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="role" data-body="concept, drawing, design, animation"><tspan x="28.45" y="2863.75">role</tspan><tspan x="28.45" y="2887.75">concept, drawing, design, animation</tspan></text></g></svg>