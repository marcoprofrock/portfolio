<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2755.82" aria-label="windkulturerbe"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/windkulturerbe.svg" x="28.45" y="140.76" width="184.29" height="54.45" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">enbw is one of germany's largest energy companies</tspan><tspan x="28.45" y="325.40000000000003">– but virtually unknown outside</tspan><tspan x="28.45" y="349.40000000000003">baden-württemberg. at the same time, wind power</tspan><tspan x="28.45" y="373.40000000000003">faces constant public resistance, despite being one</tspan><tspan x="28.45" y="397.40000000000003">of the oldest forms of energy humans have ever</tspan><tspan x="28.45" y="421.40000000000003">used.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="481.4">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="503.0">mallorca – germany's favorite holiday island – has</tspan><tspan x="28.45" y="527.0">over 3,300 historic windmills, many of them</tspan><tspan x="28.45" y="551.0">decaying. enbw turns them into a unesco world</tspan><tspan x="28.45" y="575.0">heritage petition: because wind power has history.</tspan><tspan x="28.45" y="599.0">and a future.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="659.0">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="680.6">the windmills are restored on the outside and fitted</tspan><tspan x="28.45" y="704.6">with modern wind technology on the inside. the</tspan><tspan x="28.45" y="728.6">generated energy feeds directly into ev charging</tspan><tspan x="28.45" y="752.6">stations in front of each mill – so electric cars</tspan><tspan x="28.45" y="776.6">charge exactly where wind power was harnessed</tspan><tspan x="28.45" y="800.6">centuries ago. a petition, microsite, and social</tspan><tspan x="28.45" y="824.6">campaign invite the public to support</tspan><tspan x="28.45" y="848.6">"windkulturerbe" and turn wind energy into a</tspan><tspan x="28.45" y="872.6">cultural conversation.</tspan></text></g><g id="Awards"><g id="Award-adc-germany"><image href="assets/awards/adc-germany.svg" x="26.63989238523362" y="929.7949325704946" width="50.970712436997694" height="50.970712436997694" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="90.5" y="947.6">adc talent award 2026</tspan><tspan x="90.5" y="971.6">2× bronze</tspan></text></g><g id="Award-comm"><image href="assets/awards/comm.svg" x="28.45" y="997.6" width="44.0" height="44.0" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="90.5" y="1012.6">comm awards 2025</tspan><tspan x="90.5" y="1036.6">1× bronze</tspan></text></g></g><g id="Bild-1" data-project-image=""><image href="assets/projects/windkulturerbe/03_55774050.webp" x="559.65" y="89.48" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Film-1" data-video="VYUYr6bSIUo" data-x="855.77" data-y="465.81" data-width="1037.85" data-height="583.79" /><g id="Bild-2" data-project-image=""><image href="assets/projects/windkulturerbe/05_b340ac3c.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-3" data-project-image=""><image href="assets/projects/windkulturerbe/04_8be2ddd4.webp" x="202.85" y="1292.69" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4" data-project-image=""><image href="assets/projects/windkulturerbe/02_2ecbcc90.webp" x="1214.38" y="1204.2" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Credits"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="role" data-body="art direction and concept"><tspan x="28.45" y="1820.24">role</tspan><tspan x="28.45" y="1844.24">art direction and concept</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="copywriting" data-body="hannah kormann"><tspan x="28.45" y="1904.24">copywriting</tspan><tspan x="28.45" y="1928.24">hannah kormann</tspan></text></g></svg>