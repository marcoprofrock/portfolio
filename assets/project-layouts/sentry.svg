ight="583.79" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="917.61" y="3282.15">renderings</tspan></text></g><g id="Bild-11" data-project-image=""><image href="assets/projects/sentry/05_design-language.svg" x="494.12" y="3518.08" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="576.6" y="3468.08">design language</tspan></text></g><g id="Bild-12" data-project-image=""><image href="assets/projects/sentry/13_skischule.webp" x="202.85" y="4039.03" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="267.66" y="3989.03">expert interview</tspan></text></g><g id="Bild-13" data-project-image=""><image href="assets/projects/sentry/10_buch.webp" x="1214.38" y="4030.54" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1214.38" y="3982.39">documentation</tspan></text></g><g id="Bild-14" data-project-image=""><image href="assets/projects/sentry/14_gurtsystem.webp" x="720.56" y="4539.29" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-15" data-project-image=""><image href="assets/projects/sentry/06_design-element.svg" x="1312.69" y="4574.58" width="580.93" height="871.97" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1312.69" y="4703.34">design element</tspan></text></g><g id="Bild-16" data-project-image=""><image href="assets/projects/sentry/07_colors.svg" x="26.38" y="4882.3" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="26.38" y="4992.64">colors</tspan></text></g><g id="Bild-17" data-project-image=""><image href="assets/projects/sentry/03_mantra.svg" x="559.65" y="6179.31" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="559.65" y="6291.77">the mantra</tspan></text></g><g id="Bild-18" data-project-image=""><image href="assets/projects/sentry/11_halterung.webp" x="855.77" y="6515.64" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-19" data-project-image=""><image href="assets/projects/sentry/01_logo.svg" x="494.12" y="6821.57" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="494.12" y="6868.63">logo</tspan></text></g><g id="Bild-20" data-project-image=""><image href="assets/projects/sentry/15_skizzen-bogen.webp" x="202.85" y="7342.52" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="265.16" y="7292.52">sketches</tspan></text></g><g id="Bild-21" data-project-image=""><image href="assets/projects/sentry/12_schnalle.webp" x="1214.38" y="7334.03" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1214.38" y="7285.88">the clip</tspan></text></g><g id="Bild-22" data-project-image=""><image href="assets/projects/sentry/09_druck-muster.webp" x="720.56" y="7842.78" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-23" data-project-image=""><image href="assets/projects/sentry/02_your-sentry-in-the-mountains.svg" x="1485.62" y="8260.93" width="408.0" height="233.52" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1485.62" y="8210.93">your sentry in the mountains</tspan></text></g><g id="Bild-24" data-project-image=""><image href="assets/projects/sentry/01_arrow-down.svg" x="297.0" y="5669.37" width="75.08" height="82.5" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="297.0" y="5619.37">icons</tspan></text></g><g id="Bild-25" data-project-image=""><image href="assets/projects/sentry/02_arrow-up.svg" x="560.38" y="5669.37" width="75.08" height="82.5" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-26" data-project-image=""><image href="assets/projects/sentry/03_arrow-down-right.svg" x="828.91" y="5678.26" width="64.79" height="64.72" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-27" data-project-image=""><image href="assets/projects/sentry/04_arrow-down-left.svg" x="1092.32" y="5678.23" width="64.72" height="64.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-28" data-project-image=""><image href="assets/projects/sentry/05_battery.svg" x="1332.92" y="5695.46" width="110.3" height="30.31" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-29" data-project-image=""><image href="assets/projects/sentry/06_person.svg" x="1633.54" y="5677.26" width="35.82" height="66.71" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-30" data-project-image=""><image href="assets/projects/sentry/07_group.svg" x="273.58" y="5861.42" width="121.93" height="66.71" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-31" data-project-image=""><image href="assets/projects/sentry/08_flag.svg" x="575.86" y="5853.53" width="44.12" height="82.5" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-32" data-project-image=""><image href="assets/projects/sentry/09_mountains.svg" x="794.74" y="5875.36" width="133.12" height="38.83" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-33" data-project-image=""><image href="assets/projects/sentry/10_skis.svg" x="1090.38" y="5832.7" width="68.61" height="124.16" preserveAspectRatio="xMidYMid meet" /></g><g id