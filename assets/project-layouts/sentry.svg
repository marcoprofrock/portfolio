<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 9114.97" aria-label="sentry"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/sentry.svg" x="28.45" y="140.76" width="127.47" height="114.46" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="315.0938883637292">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="336.69388836372923">an avalanche transceiver is the only piece of gear</tspan><tspan x="28.45" y="360.69388836372923">you buy hoping never to use it – and the only one</tspan><tspan x="28.45" y="384.69388836372923">you will operate with a heart rate of 180, gloves</tspan><tspan x="28.45" y="408.69388836372923">on, wind in your face and fifteen minutes before</tspan><tspan x="28.45" y="432.69388836372923">odds collapse. yet the category still communicates</tspan><tspan x="28.45" y="456.69388836372923">like consumer electronics: crowded housings, menu</tspan><tspan x="28.45" y="480.69388836372923">logic, feature lists.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="540.6938883637292">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="562.2938883637293">build the brand around one promise – your sentry</tspan><tspan x="28.45" y="586.2938883637293">in the mountains – and judge every decision by a</tspan><tspan x="28.45" y="610.2938883637293">single question: does it survive panic? identity,</tspan><tspan x="28.45" y="634.2938883637293">housing and interface become one system, so</tspan><tspan x="28.45" y="658.2938883637293">intuition is treated as a safety feature rather than</tspan><tspan x="28.45" y="682.2938883637293">a nice-to-have.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="742.2938883637293">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="763.8938883637293">three colours do the explaining: orange is</tspan><tspan x="28.45" y="787.8938883637293">everything you touch, sand is the body you hold,</tspan><tspan x="28.45" y="811.8938883637293">anthracite is the mount that holds you. one sliding</tspan><tspan x="28.45" y="835.8938883637293">switch, search, send, off, replaces the menu,</tspan><tspan x="28.45" y="859.8938883637293">guarded by a release button so the mode can never</tspan><tspan x="28.45" y="883.8938883637293">change by accident. soft, over-tensioned volumes</tspan><tspan x="28.45" y="907.8938883637293">read as impact-resistant before you know what the</tspan><tspan x="28.45" y="931.8938883637293">object does, and the same geometry generates the</tspan><tspan x="28.45" y="955.8938883637293">icons, the display and the chevron that runs across</tspan><tspan x="28.45" y="979.8938883637293">the brand.</tspan></text></g><g id="Awards" /><g id="Bild-1" data-project-image=""><image href="assets/projects/sentry/01_markenboard.webp" x="559.65" y="129.48000000000002" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="559.65" y="95.23">the brand</tspan></text></g><g id="Bild-2" data-project-image="" data-clip="assets/projects/sentry/02_showreel.mp4" data-x="855.77" data-y="585.81" data-width="1037.85" data-height="583.79"><image href="assets/projects/sentry/02_showreel.webp" x="855.77" y="585.81" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="855.77" y="535.81">showreel</tspan></text></g><g id="Bild-3" data-project-image=""><image href="assets/projects/sentry/03_geraet-halterung-hoch.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio=