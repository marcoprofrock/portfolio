<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 7678.8" aria-label="u-turn"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/u-turn.svg" x="28.45" y="140.76" width="184.29" height="39.79" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">car vs. public transport is one of the most</tspan><tspan x="28.45" y="325.40000000000003">polarizing debates in urban mobility – yet most</tspan><tspan x="28.45" y="349.40000000000003">arguments stay abstract. people know the statistics</tspan><tspan x="28.45" y="373.40000000000003">but rarely feel the trade-offs of either choice in a</tspan><tspan x="28.45" y="397.40000000000003">visceral way.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="457.4">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="479.0">turn the debate into a game. two teams compete</tspan><tspan x="28.45" y="503.0">head-to-head in a spatial installation – one drives,</tspan><tspan x="28.45" y="527.0">one rides public transport. both face real obstacles.</tspan><tspan x="28.45" y="551.0">the winner is decided by play, not opinion.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="624.73">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="646.33">a room-sized immersive board game splits visitors</tspan><tspan x="28.45" y="670.33">into two sides. the car team deals with traffic jams</tspan><tspan x="28.45" y="694.33">and parking costs; the public transport team</tspan><tspan x="28.45" y="718.33">navigates route planning and delays.</tspan><tspan x="28.45" y="742.33">microcontrollers, reactive sound and lighting, and</tspan><tspan x="28.45" y="766.33">„event cards“ played by opponents make every</tspan><tspan x="28.45" y="790.33">trade-off physically felt – not just discussed.</tspan></text></g><g id="Awards"><g id="Award-adc-germany"><image href="assets/awards/adc-germany.svg" x="26.63989238523362" y="847.5249325704946" width="50.970712436997694" height="50.970712436997694" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="90.5" y="865.33">adc talent award 2026</tspan><tspan x="90.5" y="889.33">1× auszeichnung</tspan></text></g></g><g id="Bild-1" data-project-image=""><image href="assets/projects/u-turn/image-0faa8148-b363-49f8-ae55-a0079e1c1c0c.jpg.webp" x="559.65" y="89.48" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2" data-project-image="" data-clip="assets/projects/u-turn/02_showreel.mp4" data-x="855.77" data-y="465.81" data-width="1037.85" data-height="583.79"><image href="assets/projects/u-turn/02_showreel.webp" x="855.77" y="465.81" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-3" data-project-image=""><image href="assets/projects/u-turn/image-81b2d706-589a-41a8-8332-bf1caf73f76f.jpg.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4" data-project-image=""><image href="assets/projects/u-turn/image-29a5ac25-0562-4f77-9308-6aa9bcac31e1.jpg.webp" x="202.85" y="1292.69" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-5" data-project-image=""><image href="assets/projects/u-turn/image-54d9fcc9-ec43-40ac-a225-a82a3b801ca0.jpg.webp" x="1214.38" y="1204.2" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6" data-project-image=""><image href="assets/projects/u-turn/image-1ec3bd8b-8ef5-4262-8791-daf6b3d4b91d.jpg.webp" x="720.56" y="1792.95" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-7" data-project-image=""><image href="assets/projects/u-turn/image-fedaaa18-2df4-4f95-8a0a-f73b58fb6934.jpg.webp" x="1312.69" y="1748.24" width="580.93" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Film-1" data-video="wq7H9TDo9vg" data-x="26.38" data-y="2135.96" data-width="1037.85" data-height="583.79" data-poster="assets/projects/u-turn/film-wq7H9TDo9vg.jpg" data-direct="" /><g id="Bild-8" data-project-image=""><image href="assets/projects/u-turn/image-575bce08-f279-4dd1-9832-f579e2d9a858.jpg.webp" x="559.65" y="2835.82" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-9" data-project-image=""><image href="assets/projects/u-turn/image-66ca3eb7-acbc-4394-9d88-bf387d81c077.jpg.webp" x="855.77" y="3212.15" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-10" data-project-image=""><image href="assets/projects/u-turn/image-6cd51cb1-e5b7-4f68-9f91-34fd37614e84.jpg.webp" x="494.12" y="3518.08" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-11" data-project-image=""><image href="assets/projects/u-turn/image-7178d4a5-6d6e-4a96-a479-4db9df6522d1.jpg.webp" x="202.85" y="4039.03" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-12" data-project-image=""><image href="assets/projects/u-turn/image-7b17f8e4-c765-495f-be83-81a02e9f36a9.jpg.webp" x="1214.38" y="3950.54" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-13" data-project-image=""><image href="assets/projects/u-turn/image-9074bd7a-6908-4f19-b39c-37fb0a51cbbf.jpg.webp" x="720.56" y="4539.29" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-14" data-project-image=""><image href="assets/projects/u-turn/image-9cdba7f6-3faf-4532-8ad8-61047fcabd81.jpg.webp" x="1312.69" y="4494.58" width="580.93" height="871.97" preserveAspectRatio