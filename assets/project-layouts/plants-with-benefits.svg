<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 8372.52" aria-label="plants with benefits"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/plants-with-benefits.svg" x="28.45" y="140.76" width="178.01" height="100.0" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="300.63">insight</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="322.23">people care more about their wild life than wildlife.</tspan><tspan x="28.45" y="346.23">flexitarians are open to eating more plants. but</tspan><tspan x="28.45" y="370.23">distant benefits for the planet struggle to compete</tspan><tspan x="28.45" y="394.23">with personal desires: feeling healthier, more</tspan><tspan x="28.45" y="418.23">confident and more fulfilled. research suggests</tspan><tspan x="28.45" y="442.23">plant rich diets may support sexual wellbeing. an</tspan><tspan x="28.45" y="466.23">unexpected benefit that gives people a compelling</tspan><tspan x="28.45" y="490.23">reason to reconsider what’s on their plate.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="550.23">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="571.83">make a personal desire a reason to give nature</tspan><tspan x="28.45" y="595.83">more room.</tspan><tspan x="28.45" y="619.83">plants with benefits is a movement inviting people</tspan><tspan x="28.45" y="643.83">to explore what eating more plants could do for</tspan><tspan x="28.45" y="667.83">their sex life, and for nature. instead of asking</tspan><tspan x="28.45" y="691.83">people to give something up for the planet, we give</tspan><tspan x="28.45" y="715.83">them something worth choosing for themselves.</tspan><tspan x="28.45" y="739.83">swapping meat for plant based protein can reduce</tspan><tspan x="28.45" y="763.83">demand for agricultural land, easing pressure on</tspan><tspan x="28.45" y="787.83">wildlife habitats.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="847.83">execution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="869.4300000000001">arnold schwarzenegger challenges the myth that</tspan><tspan x="28.45" y="893.4300000000001">strength comes from meat, inviting people to</tspan><tspan x="28.45" y="917.4300000000001">discover what plants could do in the bedroom and</tspan><tspan x="28.45" y="941.4300000000001">beyond.</tspan><tspan x="28.45" y="965.4300000000001" /><tspan x="28.45" y="989.4300000000001">creators across food, fitness and sexual wellness</tspan><tspan x="28.45" y="1013.4300000000001">take the idea into their own worlds, while social,</tspan><tspan x="28.45" y="1037.43">outdoor, dating apps and unexpected media</tspan><tspan x="28.45" y="1061.43">placements turn plants with benefits into a cultural</tspan><tspan x="28.45" y="1085.43">conversation.</tspan><tspan x="28.45" y="1109.43" /><tspan x="28.45" y="1133.43">then the app turns curiosity into a habit. every</tspan><tspan x="28.45" y="1157.43">plant protein choice builds a streak with nature,</tspan><tspan x="28.45" y="1181.43">with reminders, recipes, challenges and food</tspan><tspan x="28.45" y="1205.43">delivery integrations making the next one easier.</tspan><tspan x="28.45" y="1229.43" /><tspan x="28.45" y="1253.43">a live impact tracker connects individual choices to</tspan><tspan x="28.45" y="1277.43">a collective picture: meals swapped, habits built</tspan><tspan x="28.45" y="1301.43">and land potentially freed for nature.</tspan><tspan x="28.45" y="1325.43" /><tspan x="28.45" y="1349.43">one personal benefit.</tspan><tspan x="28.45" y="1373.43">one daily choice.</tspan><tspan x="28.45" y="1397.43">a whole lot more room for the wild.</tspan></text></g><g id="Awards" /><defs><clipPath id="pwb-impact-clip"><rect x="494.12" y="6730" width="1340" height="1250" /></clipPath></defs><g id="showreel" data-project-image="" data-clip="assets/projects/plants-with-benefits/showreel.mp4" data-x="855.77" data-y="89.48" data-width="1037.85" data-height="583.79"><image x="855.77" y="89.48" width="1037.85" height="583.79" href="assets/projects/plants-with-benefits/showreel.webp" preserveAspectRatio="xMidYMid slice" role="img" aria-label="showreel" /></g><text x="559.65" y="748" font-family="RotisArchive, sans-serif" font-size="20" fill="#000">influencers</text><g id="arnold" data-project-image=""><image x="650" y="785" width="778" height="398.474212034384" href="assets/projects/plants-with-benefits/influencer-arnold.svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="arnold" /><text x="1458" y="1161.4742" font-family="RotisArchive, sans-serif" font-size="18" fill="#000">arnold schwarzenegger</text><text x="1458" y="1183.4742" font-family="RotisArchive, sans-serif" font-size="18" fill="#000">bodybuilding legend and plant based advocate</text></g><g id="jameela" data-project-image=""><image x="550" y="1225" width="190" height="284.2910447761194" href="assets/projects/plants-with-benefits/influencer-jameela.webp" preserveAspectRatio="xMidYMid meet" role="img" aria-label="jameela" /><text x="550" y="1539.291" font-family="RotisArchive, sans-serif" font-size="18" fill="#000">jameela jamil</text><text x="550" y="1561.291" font-family="RotisArchive, sans-serif" font-size="18" fill="#000">personal wellbeing</text></g><g id="gaz" data-project-image=""><image x="830" y="1285" width="190" height="218.5" href="assets/projects/plants-with-benefits/influencer-gaz.webp" preserveAspectRatio="xMidYMid meet" role="img" aria-label="gaz" /><text x="830" y="1533.5" font-family="RotisArchive, sans-serif" font-size="18" fill="#000">gaz oakley</text><text x="830" y="1555.5" font-family="RotisArchive, sans-serif" font