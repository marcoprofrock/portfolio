<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 4683.89" aria-label="i love stuttgart"><g id="Projekttext"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="150">i love stuttgart</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">the energy transition is complex and mostly told as</tspan><tspan x="28.45" y="325.40000000000003">must and should. hard to love – especially for gen z</tspan><tspan x="28.45" y="349.40000000000003">and millennials. stadtwerke stuttgart wanted the</tspan><tspan x="28.45" y="373.40000000000003">city to fall for it anyway.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="436.35">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="457.95000000000005">treat it like a relationship: „aus liebe zu stuttgart"</tspan><tspan x="28.45" y="481.95000000000005">– out of love for stuttgart. and every relationship</tspan><tspan x="28.45" y="505.95000000000005">needs a coach. meet dr. kessel, named after the</tspan><tspan x="28.45" y="529.95">basin stuttgart sits in and played by merlin</tspan><tspan x="28.45" y="553.95">sandmeyer. he spots the red flags and teaches the</tspan><tspan x="28.45" y="577.95">city new love languages.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="637.95">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="659.5500000000001">four colours, one love coach. films and key visuals</tspan><tspan x="28.45" y="683.5500000000001">like „erkenn die red flags: zu viel kohle." ran on</tspan><tspan x="28.45" y="707.5500000000001">billboards, trams, the cannstatter wasen and social</tspan><tspan x="28.45" y="731.5500000000001">media – while i love stuttgart stickers turned up all</tspan><tspan x="28.45" y="755.5500000000001">over town.</tspan></text></g><g id="Awards" /><g id="Bild-1" data-project-image=""><image href="assets/projects/i-love-stuttgart/01_sticker-banner.webp" x="559.65" y="89.48" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2" data-project-image="" data-clip="assets/projects/i-love-stuttgart/02_film-rot.mp4" data-x="855.77" data-y="465.81" data-width="328.38" data-height="583.79" data-sound=""><image href="assets/projects/i-love-stuttgart/02_film-rot.webp" x="855.77" y="465.81" width="328.38" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-3" data-project-image="" data-clip="assets/projects/i-love-stuttgart/03_film-blau.mp4" data-x="1210.5" data-y="465.81" data-width="328.38" data-height="583.79" data-sound=""><image href="assets/projects/i-love-stuttgart/03_film-blau.webp" x="1210.5" y="465.81" width="328.38" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4" data-project-image="" data-clip="assets/projects/i-love-stuttgart/04_film-lila.mp4" data-x="1565.23" data-y="465.81" data-width="328.38" data-height="583.79" data-sound=""><image href="assets/projects/i-love-stuttgart/04_film-lila.webp" x="1565.23" y="465.81" width="328.38" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-5" data-project-image="" data-clip="assets/projects/i-love-stuttgart/05_bts-2.mp4" data-x="494.12" data-y="771.74" data-width="331.8" data-height="488.24" data-unmute=""><image href="assets/projects/i-love-stuttgart/05_bts-2.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6" data-project-image=""><image href="assets/projects/i-love-stuttgart/06_wasen-eingang.webp" x="202.85" y="1292.69" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-7" data-project-image="" data-clip="assets/projects/i-love-stuttgart/07_matchcuts.mp4" data-x="1214.38" data-y="1204.2" data-width="568.76" data-height="382.55"><image href="assets/projects/i-love-stuttgart/07_matchcuts.webp" x="1214.38" y="1204.2" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-8" data-project-image=""><image href="assets/projects/i-love-stuttgart/11_anstossen.webp" x="720.56" y="1792.95" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-9" data-project-image="" data-clip="assets/projects/i-love-stuttgart/09_bts.mp4" data-x="1312.69" data-y="1748.24" data-width="580.93" data-height="871.97" data-unmute=""><image href="assets/projects/i-love-stuttgart/09_bts.webp" x="1312.69" y="1748.24" width="580.93" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-10" data-project-image=""><image href="assets/projects/i-love-stuttgart/10_love-language.webp" x="26.38" y="2135.96" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-11" data-project-image=""><image href="assets/projects/i-love-stuttgart/08_esel-sticker.webp" x="855.77" y="3052.03" width="467.03" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-12" data-project-image=""><image href="assets/projects/i-love-stuttgart/12_wasen-kessel.webp" x="202.85" y="2835.82" width="450.0" height="800.0" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-13" data-project-image=""><image href="assets/projects/i-love-stuttgart/08_sticker-baum.webp" x="1011.99" y="3836.82" width="382.55" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-14" data-project-image=""><image href="assets/projects/i-love-stuttgart/12_herbst-fassade.webp" x="494.12" y="3751.82" width="374.04" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-15" data-project-image=""><image href="assets/projects/i-love-stuttgart/12_ballon.webp" x="1403.14" y="2835.82" width="490.48" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Credits"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="agency" data-body="scholz &amp; friends"><tspan x="28.45" y="4279.37">agency</tspan><tspan x="28.45" y="4303.37">scholz &amp; friends</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="copy" data-body="norman wursthorn"><tspan x="28.45" y="4363.37">copy</tspan><tspan x="28.45" y="4387.37">norman wursthorn</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="art" data-body="dominik lang, gerrit-john gerischer, carolin scherer, marco pröfrock"><tspan x="28.45" y="4447.37">art</tspan><tspan x="28.45" y="4471.37">dominik lang, gerrit-john gerischer, carolin scherer,</tspan><tspan x="28.45" y="4495.37">marco pröfrock</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="production" data-body="miss murphy"><tspan x="28.45" y="4555.37">production</tspan><tspan x="28.45" y="4579.37">miss murphy</tspan></text></g></svg>