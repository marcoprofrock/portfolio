<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 3040.27" aria-label="hope in action"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/hope-in-action.svg" x="28.45" y="140.76" width="184.29" height="49.23" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">problem</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">unicef is losing connection with gen z. 75% find</tspan><tspan x="28.45" y="325.40000000000003">the future frightening, 55.7% believe humanity is</tspan><tspan x="28.45" y="349.40000000000003">doomed. in this climate, hope feels naive – and</tspan><tspan x="28.45" y="373.40000000000003">unicef's mission becomes invisible to the</tspan><tspan x="28.45" y="397.40000000000003">generation that could carry it forward.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="457.4">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="479.0">reframe hope as something active, not passive.</tspan><tspan x="28.45" y="503.0">"hope in action" hijacks the pop culture moments</tspan><tspan x="28.45" y="527.0">gen z already loves – streaming, gaming, music –</tspan><tspan x="28.45" y="551.0">and places unicef's real-time results right next to</tspan><tspan x="28.45" y="575.0">fictional heroes saving the world.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="635.0">solution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="656.6">an ai links streaming platforms' databases with</tspan><tspan x="28.45" y="680.6">unicef's annual report to generate contextual</tspan><tspan x="28.45" y="704.6">5-second messages in real time: "while beth</tspan><tspan x="28.45" y="728.6">mastered chess, unicef helped 18.6 million children</tspan><tspan x="28.45" y="752.6">access education." the platform spans ott, twitch,</tspan><tspan x="28.45" y="776.6">spotify, tiktok (#hopecore), and ooh – all driving to</tspan><tspan x="28.45" y="800.6">a landing page for donations or volunteer sign-ups.</tspan></text></g><g id="Awards"><g id="Award-cannes"><image href="assets/awards/cannes.svg" x="26.644194194194192" y="859.3117117117117" width="46.7967967967968" height="46.7967967967968" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="90.5" y="875.6">cannes lions · the brief</tspan><tspan x="90.5" y="899.6">global winner</tspan></text></g></g><g id="Bild-1" data-project-image=""><image href="assets/projects/hope-in-action/08_board.webp" x="559.65" y="89.48" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2" data-project-image=""><image href="assets/projects/hope-in-action/01_109b8a4e.webp" x="855.77" y="465.81" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-3" data-project-image=""><image href="assets/projects/hope-in-action/06_b91aac7c.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4" data-project-image=""><image href="assets/projects/hope-in-action/02_134e8cbc.webp" x="202.85" y="1292.69" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-5" data-project-image=""><image href="assets/projects/hope-in-action/03_734d2da4.webp" x="1214.38" y="1204.2" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6" data-project-image=""><image href="assets/projects/hope-in-action/05_9728e846.webp" x="720.56" y="1792.95" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-7" data-project-image=""><image href="assets/projects/hope-in-action/04_800fb060.webp" x="1312.69" y="1748.24" width="580.93" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-8" data-project-image=""><image href="assets/projects/hope-in-action/07_c7249baf.webp" x="26.38" y="2135.96" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Credits"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="role" data-body="art direction and concept"><tspan x="28.45" y="2779.75">role</tspan><tspan x="28.45" y="2803.75">art direction and concept</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="team" data-body="kunal khade, mohamad al qarawi, marion mondoloni, melissa duarte de almeida, niamh aremband"><tspan x="28.45" y="2863.75">team</tspan><tspan x="28.45" y="2887.75">kunal khade, mohamad al qarawi, marion</tspan><tspan x="28.45" y="2911.75">mondoloni, melissa duarte de almeida, niamh</tspan><tspan x="28.45" y="2935.75">aremband</tspan></text></g></svg>