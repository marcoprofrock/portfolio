<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 3698.08" aria-label="mission octopus"><g id="Projekttext"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="150">mission octopus</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">brief</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">flyeralarm design award 2026, category animals.</tspan><tspan x="28.45" y="325.40000000000003">sea shepherd's brief „mission oktopus": finger weg</tspan><tspan x="28.45" y="349.40000000000003">von den tentakeln! illegal traps threaten octopuses</tspan><tspan x="28.45" y="373.40000000000003">in the mediterranean — an estimated 500,000 in</tspan><tspan x="28.45" y="397.40000000000003">the thracian sea alone. four motifs, each as a4</tspan><tspan x="28.45" y="421.40000000000003">poster and social post.</tspan></text></g><g id="Awards" /><g id="Bild-1" data-project-image=""><image href="assets/projects/mission-octopus/02a_plakat_mockup.webp" x="549.61" y="89.48" width="616.58" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2-1" data-project-image="" data-reveal-start="209.1" data-reveal-distance="632.73"><image href="assets/projects/mission-octopus/ig-header.webp" x="1196.04" y="209.1" width="393.0" height="70.74" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2-2" data-project-image="" data-reveal-start="209.1" data-reveal-distance="632.73"><image href="assets/projects/mission-octopus/02b_social.webp" x="1196.04" y="279.84" width="393.0" height="491.25" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2-3" data-project-image="" data-reveal-start="209.1" data-reveal-distance="632.73"><image href="assets/projects/mission-octopus/ig-caption.webp" x="1196.04" y="771.09" width="393.0" height="70.74" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2-Ra