octopus/04b_social.webp" x="1196.04" y="2080.26" width="393.0" height="491.25" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6-3" data-project-image="" data-reveal-start="2009.52" data-reveal-distance="632.73"><image href="assets/projects/mission-octopus/ig-caption.webp" x="1196.04" y="2571.51" width="393.0" height="70.74" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6-Rahmen" data-project-image="" data-reveal-start="2009.52" data-reveal-distance="632.73"><rect x="1196.04" y="2009.52" width="393.0" height="632.73" rx="31.44" ry="31.44" fill="none" stroke="#000" stroke-width="0.5" /></g><g id="Bild-7" data-project-image=""><image href="assets/projects/mission-octopus/01a_plakat_mockup.webp" x="549.61" y="2790.11" width="616.58" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-8-1" data-project-image="" data-reveal-start="2909.73" data-reveal-distance="632.73"><image href="assets/projects/mission-octopus/ig-header.webp" x="1196.04" y="2909.73" width="393.0" height="70.74" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-8-2" data-project-image="" data-reveal-start="2909.73" data-reveal-distance="632.73"><image href="assets/projects/mission-octopus/01b_social.webp" x="1196.04" y="2980.47" width="393.0" height="491.25" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-8-3" data-project-image="" data-reveal-start="2909.73" data-reveal-distance="632.73"><image href="assets/projects/mission-octopus/ig-caption.webp" x="1196.04" y="3471.72" width="393.0" height="70.74" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-8-Rahmen" data-project-image="" data-reveal-start="2909.73" data-reveal-distance="632.73"><rect x="1196.04" y="2909.73" width="393.0" height="632.73" rx="31.44" ry="31.44" fill="none" stroke="#000" stroke-width="0.5" /></g><g id="Text-1" data-project-image=""><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1618.89" y="222.9">use yours to protect three.</tspan><tspan x="1618.89" y="246.9" /><tspan x="1618.89" y="270.9">illegal fishing methods threaten</tspan><tspan x="1618.89" y="294.9">octopuses in the mediterranean. in</tspan><tspan x="1618.89" y="318.9">summer 2025 alone, sea shepherd</tspan><tspan x="1618.89" y="342.9">rescued 1,584 octopuses and</tspan><tspan x="1618.89" y="366.9">removed 34,546 illegal traps.</tspan><tspan x="1618.89" y="390.9">support our fight against it with</tspan><tspan x="1618.89" y="414.9">your donation.</tspan></text></g><g id="Text-2" data-project-image=""><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1618.89" y="1123.11">show some backbone for</tspan><tspan x="1618.89" y="1147.11">invertebrates.</tspan><tspan x="1618.89" y="1171.11" /><tspan x="1618.89" y="1195.11">illegal fishing methods threaten</tspan><tspan x="1618.89" y="1219.11">octopuses in the mediterranean.</tspan><tspan x="1618.89" y="1243.11">sea shepherd removes the traps</tspan><tspan x="1618.89" y="1267.11">and frees the animals. in summer</tspan><tspan x="1618.89" y="1291.11">2025 alone, that meant 1,584</tspan><tspan x="1618.89" y="1315.11">octopuses. support this mission</tspan><tspan x="1618.89" y="1339.11">with your donation.</tspan></text></g><g id="Text-3" data-project-image=""><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1618.89" y="2923.53">knock one back with all eight</tspan><tspan x="1618.89" y="2947.53">arms, instead of knocking back an</tspan><tspan x="1618.89" y="2971.53">eight-armed one!</tspan><tspan x="1618.89" y="2995.53">astra. any objections?</tspan><tspan x="1618.89" y="3019.53" /><tspan x="1618.89" y="3043.53">illegal fishing methods threaten</tspan><tspan x="1618.89" y="3067.53">octopuses in the mediterranean.</tspan><tspan x="1618.89" y="3091.53">sea shepherd removes the traps</tspan><tspan x="1618.89" y="3115.53">and frees the animals. in summer</tspan><tspan x="1618.89" y="3139.53">2025 alone, that meant 1,584</tspan><tspan x="1618.89" y="3163.53">octopuses.</tspan><tspan x="1618.89" y="3187.53" /><tspan x="1618.89" y="3211.53">20 ct of every bottle sold go to sea</tspan><tspan x="1618.89" y="3235.53">shepherd.</tspan></text></g></svg>