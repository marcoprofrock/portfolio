<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2755.82" aria-label="s-neo"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/s-neo.svg" x="28.45" y="140.76" width="184.29" height="51.6" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="279.8">project</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="301.40000000000003">s-neo is the new mobile broker of the sparkasse,</tspan><tspan x="28.45" y="325.40000000000003">right inside the sparkassen-app. for its launch, an</tspan><tspan x="28.45" y="349.40000000000003">out-of-home campaign across germany was to be</tspan><tspan x="28.45" y="373.40000000000003">developed. each headline takes its wordplay from</tspan><tspan x="28.45" y="397.40000000000003">the place it hangs in.</tspan></text></g><g id="Awards" /><g id="Bild-1" data-project-image="" data-mobile-order="0"><image href="assets/projects/s-neo/04_berlin_kudamm-mockup.webp" x="559.65" y="89.48" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="639.6" y="467.57">location: berlin-kurfürstendamm</tspan><tspan x="639.6" y="489.57">„become a kursfürst now!" a kurfürst is a prince-elector – the street's namesake –</tspan><tspan x="639.6" y="511.57">while „kurs" means share price in german.</tspan></text></g><g id="Bild-2" data-project-image="" data-mobile-order="1"><image href="assets/projects/s-neo/05_hamburg_hammerbrook-mockup.webp" x="855.77" y="571.57" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="936.85" y="1185.36">location: hamburg-hammerbrook</tspan><tspan x="936.85" y="1207.36">„hammer broker!" hammerbrook is the district, while „hammer" is german slang for awesome.</tspan></text></g><g id="Bild-3" data-project-image="" data-mobile-order="2"><image href="assets/projects/s-neo/07_muenchen_upsidedown-mockup.webp" x="202.85" y="1398.45" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="202.85" y="1896.0">location: münchen-stachus</tspan><tspan x="202.85" y="1918.0">„just gawking won't get you anywhere." in bavarian dialect, on a screen turned upside down.</tspan></text></g><g id="Bild-4" data-project-image="" data-mobile-order="3"><image href="assets/projects/s-neo/06_muenchen_sideways-mockup.webp" x="1214.38" y="1309.96" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /><text font-family="RotisArchive, sans-serif" font-size="18" font-weight="400"><tspan x="1214.38" y="1691.2">location: münchen-stachus</tspan><tspan x="1214.38" y="1713.2">the same line, turned sideways.</tspan></text></g><g id="Credits"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="role" data-body="copywriting"><tspan x="28.45" y="1978.0">role</tspan><tspan x="28.45" y="2002.0">copywriting</tspan></text></g></svg>