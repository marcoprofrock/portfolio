<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2908.27" aria-label="vote2cop"><g id="Projekttext"><image id="Projektlogo" href="assets/project-logos/vote2cop.svg" x="28.45" y="140.76" width="76.16" height="191.58" preserveAspectRatio="xMinYMin meet" /><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="392.21048613090716">insight</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="413.8104861309072">young adults camp from 3 a.m. for sneakers. they</tspan><tspan x="28.45" y="437.8104861309072">don't show up to vote.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="548.7604861309071">idea</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="570.3604861309071">we move the camp-out line to where it belongs:</tspan><tspan x="28.45" y="594.3604861309071">outside the polling stations.</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="737.1404861309072">execution</tspan></text><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="28.45" y="758.7404861309072">nike times the release of its drop to the</tspan><tspan x="28.45" y="782.7404861309072">early-voting week. you can only get the limited</tspan><tspan x="28.45" y="806.7404861309072">shoe at pop-up stores next to polling stations. you</tspan><tspan x="28.45" y="830.7404861309072">show your sticker at the door. no sticker, no shoe.</tspan></text></g><g id="Awards" /><g id="Bild-1" data-project-image=""><image href="assets/projects/vote2cop/01_popup.webp" x="559.65" y="89.48" width="778.73" height="348.09" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-2" data-project-image="" data-clip="assets/projects/vote2cop/02_showreel.mp4" data-x="855.77" data-y="465.81" data-width="1037.85" data-height="583.79"><image href="assets/projects/vote2cop/02_showreel.webp" x="855.77" y="465.81" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-3" data-project-image=""><image href="assets/projects/vote2cop/03_titel.webp" x="494.12" y="771.74" width="331.8" height="488.24" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-4" data-project-image=""><image href="assets/projects/vote2cop/04_camp.webp" x="202.85" y="1292.69" width="831.2" height="467.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-5" data-project-image=""><image href="assets/projects/vote2cop/05_schuh.webp" x="1214.38" y="1204.2" width="568.76" height="382.55" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6" data-project-image=""><image href="assets/projects/vote2cop/06_strasse.webp" x="720.56" y="1792.95" width="551.64" height="310.3" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-7" data-project-image=""><image href="assets/projects/vote2cop/07_sticker.webp" x="1312.69" y="1748.24" width="580.93" height="871.97" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-8" data-project-image=""><image href="assets/projects/vote2cop/08_schlange.webp" x="26.38" y="2135.96" width="1037.85" height="583.79" preserveAspectRatio="xMidYMid meet" /></g><g id="Credits"><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400" data-label="team" data-body="tabea reifenschweiler"><tspan x="28.45" y="2779.75">team</tspan><tspan x="28.45" y="2803.75">tabea reifenschweiler</tspan></text></g></svg>