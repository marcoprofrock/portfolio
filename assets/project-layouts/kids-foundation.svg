MidYMid meet" /></g><g id="Bild-6-3" data-project-image="" data-reveal-start="2009.52" data-reveal-distance="632.73"><image href="assets/projects/kids-foundation/ig-caption.webp" x="1196.04" y="2571.51" width="393.0" height="70.74" preserveAspectRatio="xMidYMid meet" /></g><g id="Bild-6-Rahmen" data-project-image="" data-reveal-start="2009.52" data-reveal-distance="632.73"><rect x="1196.04" y="2009.52" width="393.0" height="632.73" rx="31.44" ry="31.44" fill="none" stroke="#000" stroke-width="0.5" /></g><g id="Text-1" data-project-image=""><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1618.89" y="222.9">children aren't plants!</tspan><tspan x="1618.89" y="246.9" /><tspan x="1618.89" y="270.9">sun and water aren't enough.</tspan><tspan x="1618.89" y="294.9">children need protection, support</tspan><tspan x="1618.89" y="318.9">and opportunities. that's what the</tspan><tspan x="1618.89" y="342.9">flyeralarm kids foundation stands</tspan><tspan x="1618.89" y="366.9">for.</tspan></text></g><g id="Text-2" data-project-image=""><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1618.89" y="1123.11">what a child needs is much. it isn't</tspan><tspan x="1618.89" y="1147.11">too much to ask.</tspan></text></g><g id="Text-3" data-project-image=""><text font-family="RotisArchive, sans-serif" font-size="20" font-weight="400"><tspan x="1618.89" y="2023.32">we can already see you're headed</tspan><tspan x="1618.89" y="2047.32">for great heights.</tspan><tspan x="1618.89" y="2071.3199999999997" /><tspan x="1618.89" y="2095.3199999999997">every child deserves people who</tspan><tspan x="1618.89" y="2119.3199999999997">believe in them, and opportunities</tspan><tspan x="1618.89" y="2143.3199999999997">to grow with. that's what the</tspan><tspan x="1618.89" y="2167.3199999999997">flyeralarm kids foundation stands</tspan><tspan x="1618.89" y="2191.3199999999997">for.</tspan></text></g></svg>