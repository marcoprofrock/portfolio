<style>
/* Desktop: Vektor-iPhone in Originalgröße (375 × 812 pt → CSS-px), mittig.
   --k verkleinert nur, wenn das Browserfenster zu niedrig ist.
   Mobil (≤ 600 px): App füllt den Bildschirm, kein Rahmen. */
:root { --k: 1; --u: calc(375px / 1125); --ink: #262626; --green: #2bcc6c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: #f5f2e6; color: var(--ink); overflow: hidden;
       font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

#device { position: fixed; left: 50%; top: 50%; width: calc(442.1px * var(--k)); height: calc(870.4px * var(--k));
          transform: translate(-50%, -50%); }
.frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;
         filter: drop-shadow(0 30px 60px rgba(38, 38, 38, .18)); }
/* schwarze Unterlage, minimal größer als der Screen: keine hellen Kanten zwischen Rahmen und Display */
#device::before { content: ''; position: absolute; left: calc(29.1px * var(--k)); top: calc(25.13px * var(--k));
                  width: calc(383px * var(--k)); height: calc(818.9px * var(--k)); border-radius: calc(43.6px * var(--k));
                  background: #010101; z-index: 0; }
#screen { position: absolute; left: calc(33.1px * var(--k)); top: calc(29.13px * var(--k));
          width: calc(375px * var(--k)); height: calc(810.9px * var(--k));
          border-radius: calc(39.6px * var(--k)); overflow: hidden; background: #000; z-index: 1;
          isolation: isolate; }

.screen { position: absolute; inset: 0; display: none; overflow: hidden; background: var(--bg, #f0f0f0);
          box-shadow: -12px 0 40px rgba(0, 0, 0, .10); }
.screen.active { display: block; }
.inner { position: relative; width: 100%; }
.art { display: block; width: 100%; height: auto; }
.art rect, .art circle, .art text { transition: fill .18s ease, stroke .18s ease, opacity .25s ease; }
.hot { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Klickflächen + Hover */
.hs { fill: transparent; cursor: pointer; transition: fill .18s ease; outline: none; }
.hs:focus-visible { stroke: var(--green); stroke-width: 6; }
@media (hover: hover) {
  .hs:hover { fill: rgba(38, 38, 38, .055); }
  .hs.btn:hover { fill: rgba(0, 0, 0, .08); }
  .hs.onDark:hover { fill: rgba(255, 255, 255, .10); }
  .hs.link:hover { fill: rgba(38, 38, 38, .045); }
}
.hs:active { fill: rgba(38, 38, 38, .12); }
.hs.btn:active { fill: rgba(0, 0, 0, .14); }
.pressable { transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .18s ease;
             transform-box: fill-box; transform-origin: center; }
.pressable.lift { transform: translateY(-6px); }
.pressable.press { transform: scale(.975); transition-duration: .08s; }
.linkish.lift { opacity: .6; }

/* gemeinsame, feste Tab-Leiste */
#nav { position: absolute; left: 0; right: 0; bottom: 0; height: calc(356 * var(--u)); z-index: 5; pointer-events: none; }
#nav svg { display: block; width: 100%; height: 100%; }
#nav .hs { pointer-events: auto; }

#meal-input { position: absolute; left: calc(112 * var(--u)); top: calc(1828 * var(--u)); width: calc(915 * var(--u));
              height: calc(112 * var(--u)); padding: 0 calc(8 * var(--u)); border: 0; outline: none; background: transparent;
              font: 400 calc(45 * var(--u)) 'Public Sans', system-ui, sans-serif; color: var(--ink); caret-color: var(--green); z-index: 1; }
#meal-input::placeholder { color: #a6a6a6; }

#later { position: absolute; inset: 0; z-index: 30; background: var(--ink); display: flex; align-items: center;
         opacity: 0; transition: opacity .35s ease; }
#later.show { opacity: 1; }
#later p { margin: 0; padding: 0 calc(72 * var(--u)); font-family: 'antique-olive', sans-serif; font-weight: 700;
           color: var(--green); font-size: calc(210 * var(--u)); line-height: .86; letter-spacing: -.02em;
           transform: translateY(12px); transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
#later.show p { transform: none; }

#toast { position: absolute; left: 50%; bottom: calc(430 * var(--u)); z-index: 40; transform: translate(-50%, 12px);
         background: var(--ink); color: #fff; padding: calc(30 * var(--u)) calc(54 * var(--u)); border-radius: 999px;
         font: 600 calc(38 * var(--u)) 'Public Sans', system-ui, sans-serif; white-space: nowrap; opacity: 0;
         pointer-events: none; transition: opacity .2s ease, transform .3s cubic-bezier(.2, .8, .2, 1); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#caption { position: fixed; left: 32px; bottom: 28px; font-size: 13px; line-height: 1.5; color: rgba(38, 38, 38, .7); }
#caption p { margin: 0; }
#caption strong { color: var(--ink); font-weight: 600; }
#restart { margin-top: 12px; font: 600 13px 'Public Sans', system-ui, sans-serif; color: var(--ink); background: transparent;
           border: 1px solid var(--ink); border-radius: 999px; padding: 7px 16px; cursor: pointer;
           transition: background .18s ease, color .18s ease; }
#restart:hover { background: var(--ink); color: #fff; }

/* Mobil: echte App-Ansicht */
@media (max-width: 600px) {
  body { background: var(--ink); }
  #device { left: 0; top: 0; right: 0; bottom: 0; width: auto; height: auto; transform: none; }
  .frame, #caption, #device::before { display: none; }
  #screen { inset: 0; left: 0; top: 0; width: 100%; height: 100%; border-radius: 0; }
  .screen { overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .sb, .hi { visibility: hidden; }  /* Statusleiste + Home-Indikator liefert das echte Telefon */
}
@media (max-height: 520px), (max-width: 1000px) { #caption { display: none; } }

<script>
/* plants with benefits – klickbarer Prototyp
 * Screens = Original-SVGs (Arbeitskopien). Klickflächen liegen als transparente
 * Rechtecke in SVG-Koordinaten (1125 × 2436) über den Screens.
 */
(() => {
const NS = 'http://www.w3.org/2000/svg';
const W = 1125;
const $ = (k, id) => document.getElementById(k + '__' + id);
const scr = k => document.getElementById('screen-' + k);
const q = (k, sel) => scr(k).querySelector(sel);
const mobile = () => matchMedia('(max-width: 600px)').matches;
const WITH_NAV = new Set(['home', 'duo']);
const THEME = { home: '#262626', recap: '#262626' };
const EASE = 'cubic-bezier(.2,.8,.2,1)';

/* ------------------------------------------------------------ Layout */
function layout() {
  const r = document.documentElement.style;
  if (mobile()) { r.setProperty('--k', 1); r.setProperty('--u', innerWidth / W + 'px'); return; }
  const k = Math.min(1, (innerHeight - 40) / 870.4, (innerWidth - 40) / 442.1);
  r.setProperty('--k', k);
  r.setProperty('--u', 375 * k / W + 'px');
}
addEventListener('resize', layout);
layout();

/* ------------------------------------------ Statusleiste markieren */
const num = v => parseFloat(v || 'NaN');
document.querySelectorAll('.art').forEach(svg => {
  svg.querySelectorAll('rect, circle, polyline, text').forEach(el => {
    let y;
    if (el.tagName === 'rect') y = num(el.getAttribute('y')) + num(el.getAttribute('height'));
    else if (el.tagName === 'circle') y = num(el.getAttribute('cy'));
    else if (el.tagName === 'polyline') y = num((el.getAttribute('points') || '').trim().split(/[\s,]+/)[1]);
    else { const m = /translate\(\s*[-\d.]+[\s,]+([-\d.]+)/.exec(el.getAttribute('transform') || ''); y = m ? +m[1] : NaN; }
    const w = el.tagName === 'rect' ? num(el.getAttribute('width')) : 0;
    if (y < 112 && w < 400) el.classList.add('sb');
    if (el.tagName === 'rect' && el.getAttribute('width') === '393' && el.getAttribute('height') === '15') el.classList.add('hi');
  });
  const bg = svg.querySelector('rect[width="1125"][height="2436"]');
  if (bg) svg.closest('.screen').style.setProperty('--bg', getComputedStyle(bg).fill);
});
// Home: Statusbereich ist ein dunkles Band – dunkel füllen, falls der Viewport höher ist
scr('home').style.setProperty('--bg', '#f0f0f0');

/* ------------------------------------------------ Auswahl-Elemente */
// Arbeitskopien zeigen den ausgewählten Endzustand – für den Prototyp starten alle leer
['rq__pc-bg-on', 'rq__pc-mark-on', 'rq__none-bg-on', 'rq__none-txt-on', 'meal__dinner-bg-on', 'meal__dinner-txt-on',
 'meal__yes-bg-on', 'meal__yes-mark-on', 'daily__r1-on', 'daily__r2-on', 'daily__r3-on', 'meal__meal-caret', 'meal__meal-text']
  .forEach(id => document.getElementById(id).style.display = 'none');

function card(rect, circ) {
  const cy = +circ.getAttribute('cy'), cx = +circ.getAttribute('cx');
  const check = document.createElementNS(NS, 'polyline');
  check.setAttribute('points', `${cx - 16.5} ${cy - 1.5} ${cx - 5.25} ${cy + 9.75} ${cx + 15.37} ${cy - 14.62}`);
  Object.assign(check.style, { fill: 'none', stroke: '#fff', strokeWidth: 6.3, strokeLinecap: 'round', strokeLinejoin: 'round', opacity: 0, transition: 'opacity .18s' });
  circ.after(check);
  return on => {
    Object.assign(rect.style, on ? { fill: '#dff7d4', stroke: '#002f02', strokeWidth: 3 } : { fill: '', stroke: '', strokeWidth: '' });
    Object.assign(circ.style, on ? { fill: '#002f02', stroke: 'none' } : { fill: '', stroke: '' });
    check.style.opacity = on ? 1 : 0;
  };
}
function chip(rect, text) {
  return on => { rect.style.fill = on ? '#262626' : ''; text.style.fill = on ? '#fff' : ''; };
}
function group(setters, multi, exclusive = -1) {
  const sel = new Set();
  const render = () => setters.forEach((s, i) => s(sel.has(i)));
  return {
    toggle(i) {
      if (!multi) { sel.clear(); sel.add(i); }
      else if (sel.has(i)) sel.delete(i);
      else { if (i === exclusive) sel.clear(); else sel.delete(exclusive); sel.add(i); }
      render();
    },
    has: i => sel.has(i),
    reset() { sel.clear(); render(); },
  };
}

const G = {
  plant: group([card($('rq', 'pc-bg-off'), $('rq', 'pc-mark-off')),
                card(q('rq', 'rect[y="1128"]'), q('rq', 'circle[cy="1233"]')),
                card(q('rq', 'rect[y="1374"]'), q('rq', 'circle[cy="1479"]'))], false),
  menu: group([chip(q('rq', 'rect[x="72"][y="1791"]'), $('rq', 'Nuts')),
               chip(q('rq', 'rect[x="300"][y="1791"]'), $('rq', 'Soy')),
               chip(q('rq', 'rect[x="516"][y="1791"]'), $('rq', 'Gluten')),
               chip($('rq', 'none-bg-off'), $('rq', 'none-txt-off'))], true, 3),
  apps: group(['957.62', '1203.62', '1449.62'].map((y, i) =>
          card(q('con', `rect[y="${y}"]`), q('con', `circle[cy="${[1062.62, 1308.62, 1554.62][i]}"]`))), true),
  meal: group([chip(q('meal', 'rect[x="72"][y="930"]'), $('meal', 'Breakfast')),
               chip(q('meal', 'rect[x="408"][y="930"]'), $('meal', 'Lunch')),
               chip($('meal', 'dinner-bg-off'), $('meal', 'dinner-txt-off'))], false),
  plate: group([card($('meal', 'yes-bg-off'), $('meal', 'yes-mark-off')),
                card(q('meal', 'rect[y="1389"]'), q('meal', 'circle[cy="1494"]'))], false),
};
const RY = [978, 1341, 1704], RX = [72, 273, 474, 675, 876];
const ratings = RY.map((y, row) => group(RX.map(x => {

  return on => { r.style.fill = on ? '#2bcc6c' : ''; };
}), false));

/* ------------------------------------------------ Eingabefeld Mahlzeit */
const input = document.getElementById('meal-input');
scr('meal').querySelector('.inner').append(input);
const field = q('meal', 'rect[y="1806"]');
input.addEventListener('focus', () => Object.assign(field.style, { stroke: '#2bcc6c', strokeWidth: 4 }));
input.addEventListener('blur', () => Object.assign(field.style, { stroke: '', strokeWidth: '' }));

/* ------------------------------------------------ Streak-Zustand */
const S = { logged: false, stack: ['reg'] };
function setHome(logged, animate) {
  const p6 = $('home', 'state-6'), p7 = $('home', 'state-7'), bar = $('home', 'progress');
  const done = $('home', 'sun-done'), open = $('home', 'sun-num');
  if (!animate) {
    p6.setAttribute('opacity', logged ? 0 : 1); p7.setAttribute('opacity', logged ? 1 : 0);
    bar.setAttribute('width', logged ? 200.9 : 172.2);
    done.setAttribute('opacity', logged ? 1 : 0); open.setAttribute('opacity', logged ? 0 : 1);
    done.removeAttribute('transform');
    return;
  }
  const digit = $('home', 'digit-7-pop'), bb = digit.getBBox(), dc = [bb.x + bb.width / 2, bb.y + bb.height / 2];
  const t0 = performance.now(), ease = x => 1 - Math.pow(1 - x, 3);
  const back = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
  const step = now => {
    const t = (now - t0) / 1000, c = v => Math.min(1, Math.max(0, v));
    p6.setAttribute('opacity', 1 - ease(c(t / .18)));
    p7.setAttribute('opacity', ease(c((t - .18) / .22)));
    bar.setAttribute('width', 172.2 + 28.7 * ease(c(t / .6)));
    const pop = c(t / .35);
    done.setAttribute('opacity', ease(pop)); open.setAttribute('opacity', 1 - ease(pop));
    const s = .7 + .3 * back(pop);
    done.setAttribute('transform', `translate(999 1485.8) scale(${s}) translate(-999 -1485.8)`);
    const d = c((t - .18) / .27), ds = t < .18 ? 1 : .8 + .2 * back(d);
    digit.setAttribute('transform', `translate(${dc[0]} ${dc[1]}) scale(${ds}) translate(${-dc[0]} ${-dc[1]})`);
    if (t < .75) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
// Duo: vor dem Eintrag 6 Tage / "Up next", danach 7 Tage / "Meal logged"
const duoDays = $('duo', '_7_days'), duoCheck = q('duo', 'polyline[points^="219.09"]'), duoLogged = $('duo', 'Meal_logged');
const dot = q('duo', 'circle[cy="1504.96"]').cloneNode(); dot.setAttribute('cx', 711.09 - 467.5);
const upNext = $('duo', 'Up_next').cloneNode(true); upNext.removeAttribute('id');
upNext.setAttribute('transform', 'translate(285.5864 1512.387)');
duoLogged.after(dot, upNext);
const dayNode = [...(function* walk(n) { for (const c of n.childNodes) { if (c.nodeType === 3) yield c; else yield* walk(c); } })(duoDays)]
  .find(n => /[67]/.test(n.nodeValue));
function setDuo(logged) {
  dayNode.nodeValue = dayNode.nodeValue.replace(/[67]/, logged ? '7' : '6');
  [duoCheck, duoLogged].forEach(e => e.style.display = logged ? '' : 'none');
  [dot, upNext].forEach(e => e.style.display = logged ? 'none' : '');
}

/* ------------------------------------------------ Navigation */
const nav = document.getElementById('nav');
const navHot = nav.querySelector('.hot-nav');
let busy = false, pending = null;   // laufender Übergang: bei neuem Tipp sofort abschließen
function settle() {
  if (!pending) return;
  const p = pending; pending = null;
  p.anims.forEach(a => a.cancel());
  p.done();
}

function theme(k) {
  document.querySelector('meta[name="theme-color"]').content =
    THEME[k] || getComputedStyle(scr(k)).getPropertyValue('--bg').trim() || '#f0f0f0';
}
function activeTab(k) {
  navHot.parentNode.querySelectorAll('[data-tab]').forEach(el => {
    const on = el.dataset.tab === k;
    if (el.tagName === 'text') el.style.fill = on ? '#262626' : '';
    else el.style.stroke = on ? '#262626' : '';
  });
}
function show(k, mode = 'push') {
  const cur = S.stack[S.stack.length - 1];
  settle();
  const from = scr(cur), to = scr(k);
  if (cur === k) return;
  busy = true;
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  to.classList.add('active'); to.scrollTop = 0;
  const navFrom = WITH_NAV.has(cur), navTo = WITH_NAV.has(k);
  nav.hidden = !(navFrom || navTo);
  if (navTo) activeTab(k);
  const o = { duration: mode === 'fade' ? 220 : 380, easing: EASE };
  let finished = false;
  const done = () => {
    if (finished) return; finished = true; pending = null;
    from.classList.remove('active'); [from, to].forEach(e => e.style.zIndex = ''); nav.hidden = !navTo; busy = false;
  };
  let anims = [];
  if (mode === 'push') {
    to.style.zIndex = 2; from.style.zIndex = 1;
    anims = [to.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], o),
             from.animate([{ transform: 'none' }, { transform: 'translateX(-28%)' }], o)];
    if (navFrom && !navTo) anims.push(nav.animate([{ transform: 'none' }, { transform: 'translateX(-28%)' }], o));
    if (navTo && !navFrom) anims.push(nav.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], o));
  } else if (mode === 'pop') {
    to.style.zIndex = 1; from.style.zIndex = 2;
    anims = [from.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], o),
             to.animate([{ transform: 'translateX(-28%)' }, { transform: 'none' }], o)];
    if (navTo && !navFrom) anims.push(nav.animate([{ transform: 'translateX(-28%)' }, { transform: 'none' }], o));
    if (navFrom && !navTo) anims.push(nav.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], o));
  } else if (mode === 'fade') {
    to.style.zIndex = 2; from.style.zIndex = 1;   // Tab-Wechsel: Leiste bleibt stehen
    anims = [to.animate([{ opacity: 0 }, { opacity: 1 }], o)];
  } else { anims = []; }
  theme(k);
  if (!anims.length) return done();
  pending = { anims, done };
  anims[0].finished.then(done, () => {});
}
const go = (k, mode = 'push', reset = false) => {
  if (laterOn) return;
  const cur = S.stack[S.stack.length - 1];

  if (cur === k) return;
  if (reset) S.stack = [k]; else if (mode === 'pop') S.stack.pop(); else if (mode === 'fade') S.stack[S.stack.length - 1] = k; else S.stack.push(k);
};

async function share(title) {
  const data = { title, url: location.origin + location.pathname };
  if (navigator.share) { try { await navigator.share(data); return true; } catch (e) { return e.name !== 'AbortError'; } }
  try { await navigator.clipboard.writeText(data.url); toast('Link copied'); } catch (e) { toast('Sharing isn’t available here'); }
  return true;
}

}

function hotspot(parent, [x, y, w, h, r], fn, cls, label, targetEl) {
  const el = document.createElementNS(NS, 'rect');
  Object.entries({ x, y, width: w, height: h, rx: r, class: 'hs ' + (cls || ''), tabindex: 0, role: 'button', 'aria-label': label })
    .forEach(([a, v]) => el.setAttribute(a, v));
  el.addEventListener('click', fn);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  if (targetEl) {
    targetEl.classList.add('pressable');
    if (/link/.test(cls)) targetEl.classList.add('linkish');
    if (matchMedia('(hover: hover)').matches) {
      el.addEventListener('pointerenter', () => targetEl.classList.add('lift'));
      el.addEventListener('pointerleave', () => targetEl.classList.remove('lift', 'press'));
    }
    el.addEventListener('pointerdown', () => targetEl.classList.add('press'));
    ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => targetEl.classList.remove('press')));
  }
  parent.append(el);
}

  list.forEach(([box, fn, cls, target, label]) => hotspot(layer, box, fn, cls, label, target && $(k, target)));
});
